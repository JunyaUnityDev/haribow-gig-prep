<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>曲編集の依頼 — HARIBOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* HARIBOW パレット：ネイビー #1f294c × アイボリー #e4e3df、差し色 #b7712c */
  :root {
    --ink: #1f294c;
    --ink-2: #4a4f63;
    --muted: #8a8a83;
    --paper: #f6f4f0;
    --card: #ffffff;
    --line: #e4e1da;
    --ivory: #e4e3df;
    --accent: #b7712c;
    --accent-soft: #f4e9dc;
    --err: #8e0d11;
    --err-soft: #f3dddc;
    --ok: #153132;
    --ok-soft: #d8ebe6;
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .page { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }

  header.top { background: var(--ink); color: var(--ivory); padding: 36px 0 30px; margin-bottom: 26px; }
  header.top .in { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; opacity: .7; margin: 0 0 10px; }
  h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: .02em; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .rules li { font-size: 12.5px; border: 1px solid rgba(228,227,223,.3); border-radius: 999px; padding: 3px 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
  .card h2 .n { font-family: var(--mono); font-size: 12px; color: var(--accent); }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label.l { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .req { color: var(--accent); font-size: 11px; margin-left: 6px; font-weight: 500; }
  .opt { color: var(--muted); font-size: 11px; margin-left: 6px; font-weight: 500; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

  input[type=text], input[type=date], select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    appearance: none; -webkit-appearance: none;
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); background: #fff; box-shadow: 0 0 0 3px rgba(31,41,76,.08); }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }

  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--paper); height: 100%; }
  .choice b { display: block; font-size: 14.5px; }
  .choice small { display: block; font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
  .choice input:checked + span { border-color: var(--ink); background: #fff; box-shadow: inset 0 0 0 1px var(--ink); }
  .choice input:focus-visible + span { box-shadow: 0 0 0 3px rgba(31,41,76,.15); }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: inline-block; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px; cursor: pointer; background: var(--paper); }
  .seg input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--ivory); }

  .item { border: 1px solid var(--line); border-radius: 12px; padding: 16px 14px; margin-bottom: 12px; background: #fcfbf9; }
  .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .item-head .t { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .item-head button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .range { display: none; }
  .item.is-extend .range { display: block; }

  .add { width: 100%; border: 1px dashed #c9c5bb; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; border-radius: 12px; padding: 12px; cursor: pointer; }
  .add:hover { border-color: var(--ink); color: var(--ink); }

  .submit { width: 100%; border: 0; background: var(--ink); color: var(--ivory); font: inherit; font-size: 16px; font-weight: 700; border-radius: 12px; padding: 16px; cursor: pointer; margin-top: 6px; }
  .submit[disabled] { opacity: .5; cursor: progress; }
  .msg { display: none; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }
  .msg.err { display: block; background: var(--err-soft); color: var(--err); }

  .done { display: none; text-align: center; padding: 40px 20px; }
  .done .no { font-family: var(--mono); font-size: 34px; color: var(--accent); margin: 8px 0 4px; }
  .done p { color: var(--ink-2); font-size: 14px; }
  .is-done form { display: none; }
  .is-done .done { display: block; }

  @media (max-width: 480px) {
    .choices.two, .row2 { grid-template-columns: 1fr; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <p class="eyebrow">HARIBOW · MUSIC EDIT</p>
    <h1>曲編集の依頼</h1>
    <ul class="rules">
      <li>依頼はこのフォームから</li>
      <li>納品日は今日から3日後以降</li>
      <li>確定の依頼は後から変更しない</li>
      <li>納品は wav</li>
    </ul>
  </div>
</header>

<main class="page" id="app">
<form id="f" novalidate>
  <section class="card">
    <h2><span class="n">01</span>だれの・どの演目</h2>
    <div class="field">
      <label class="l" for="requester">依頼者<span class="req">必須</span></label>
      <input type="text" id="requester" placeholder="フルネーム（例 坂田潤弥）" autocomplete="name" required>
      <p class="hint">最終OKを出す人を1人。その人のフルネームで出してください。</p>
    </div>
    <div class="field">
      <label class="l" for="show">演目・案件名<span class="req">必須</span></label>
      <input type="text" id="show" placeholder="例 ラスベガス公演" required>
    </div>
    <div class="field">
      <label class="l" for="due">納品日<span class="req">必須</span></label>
      <input type="date" id="due" required>
      <p class="hint" id="due-hint">音源が必要な日。この日に完成版を送ります。</p>
    </div>
  </section>

  <section class="card">
    <h2><span class="n">02</span>この後、変更はありそう？</h2>
    <div class="choices two">
      <label class="choice"><input type="radio" name="lock" value="確定（この後変更しない）"><span><b>確定</b><small>この後は変更しない。仕上がった音で納品します。</small></span></label>
      <label class="choice"><input type="radio" name="lock" value="変更の可能性あり"><span><b>変更の可能性あり</b><small>まずカウントだけ合わせた版を送り、カウントが固まってから音を仕上げます。</small></span></label>
    </div>
  </section>

  <section class="card">
    <h2><span class="n">03</span>元にする音源</h2>
    <div class="field">
      <label class="l" for="source">音源<span class="req">必須</span></label>
      <input type="text" id="source" placeholder="Drive のリンク、または「前回の確定版」" required>
    </div>
  </section>

  <section class="card">
    <h2><span class="n">04</span>依頼内容</h2>
    <div id="items"></div>
    <button type="button" class="add" id="add">＋ 依頼をもう1つ足す</button>
  </section>

  <section class="card">
    <h2><span class="n">05</span>メモ<span class="opt">任意</span></h2>
    <textarea id="note" placeholder="伝えておきたいこと"></textarea>
  </section>

  <button type="submit" class="submit" id="submit">依頼を送る</button>
  <div class="msg" id="msg" role="alert"></div>
</form>

<section class="done" aria-live="polite">
  <p>受け付けました</p>
  <div class="no" id="done-no"></div>
  <p>確認用の音源ができたら連絡します。<br>この画面は閉じて大丈夫です。</p>
</section>
</main>

<template id="item-tpl">
  <div class="item">
    <div class="item-head"><span class="t"></span><button type="button" class="rm">削除</button></div>
    <div class="field">
      <label class="l">種類<span class="req">必須</span></label>
      <div class="seg type"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label class="l">時間<span class="req">必須</span></label>
        <input type="text" class="time" placeholder="例 1:28〜1:53">
      </div>
      <div class="field">
        <label class="l">量<span class="req">必須</span></label>
        <input type="text" class="amount" placeholder="例 4エイト／4カウント">
      </div>
    </div>
    <p class="hint" style="margin:-4px 0 16px">時間は再生画面を見たままでOK。数秒のずれはこちらで合わせます。</p>
    <div class="field range">
      <label class="l">伸ばす位置の幅<span class="opt">あると継ぎ目がきれい</span></label>
      <input type="text" class="rng" placeholder="例 2曲目の5〜9エイト目のどこか">
    </div>
    <div class="field">
      <label class="l">何曲目の何エイト目<span class="opt">任意</span></label>
      <input type="text" class="eight" placeholder="例 2曲目の3エイト目から">
    </div>
    <div class="field">
      <label class="l">補足<span class="opt">任意</span></label>
      <input type="text" class="detail" placeholder="例 サビ前は残したい">
    </div>
  </div>
</template>

<script>
(() => {
  const API = 'https://script.google.com/macros/s/AKfycbwcMTOHyxeHWxIuK7H12xz_0E3bmZNHCltRYoa_LbMVlVMa9MEeQWh1Bffjvgejz3S0Mg/exec';
  const TYPES = ['削る', '伸ばす', '繋ぐ', 'BPM変更', 'その他'];
  const LEAD = 3;
  const $ = s => document.querySelector(s);
  const items = $('#items');
  let seq = 0;

  // 納品日：今日（日本時間）から3日後以降
  const jst = new Date(Date.now() + 9 * 3600e3);
  const minD = new Date(Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate() + LEAD));
  const iso = minD.toISOString().slice(0, 10);
  $('#due').min = iso;
  $('#due-hint').textContent = `音源が必要な日。この日に完成版を送ります。${minD.getUTCMonth() + 1}月${minD.getUTCDate()}日以降を選べます。`;

  function renumber() {
    [...items.children].forEach((el, i) => {
      el.querySelector('.t').textContent = `依頼 ${String(i + 1).padStart(2, '0')}`;
      el.querySelector('.rm').style.visibility = items.children.length > 1 ? 'visible' : 'hidden';
    });
  }
  function addItem() {
    const el = $('#item-tpl').content.firstElementChild.cloneNode(true);
    const name = 'type' + (seq++);
    el.querySelector('.type').innerHTML = TYPES.map(t =>
      `<label><input type="radio" name="${name}" value="${t}"><span>${t}</span></label>`).join('');
    el.querySelector('.type').addEventListener('change', e => el.classList.toggle('is-extend', e.target.value === '伸ばす'));
    el.querySelector('.rm').addEventListener('click', () => { el.remove(); renumber(); });
    items.appendChild(el);
    renumber();
  }
  $('#add').addEventListener('click', addItem);
  addItem();

  function collect() {
    return {
      requester: $('#requester').value.trim(),
      show: $('#show').value.trim(),
      due: $('#due').value,
      lock: (document.querySelector('input[name=lock]:checked') || {}).value || '',
      source: $('#source').value.trim(),
      note: $('#note').value.trim(),
      items: [...items.children].map(el => ({
        type: (el.querySelector('.type input:checked') || {}).value || '',
        time: el.querySelector('.time').value.trim(),
        amount: el.querySelector('.amount').value.trim(),
        range: el.querySelector('.rng').value.trim(),
        eight: el.querySelector('.eight').value.trim(),
        detail: el.querySelector('.detail').value.trim(),
      })),
    };
  }
  function check(b) {
    if (!b.requester) return '依頼者の名前を書いてください';
    if (!b.show) return '演目・案件名を書いてください';
    if (!b.due) return '納品日を選んでください';
    if (b.due < iso) return `納品日は ${minD.getUTCMonth() + 1}月${minD.getUTCDate()}日以降を選んでください`;
    if (!b.lock) return '「この後、変更はありそう？」を選んでください';
    if (!b.source) return '元にする音源を書いてください';
    for (let i = 0; i < b.items.length; i++) {
      const it = b.items[i];
      if (!it.type) return `依頼 ${i + 1}：種類を選んでください`;
      if (!it.time) return `依頼 ${i + 1}：時間を書いてください（例 1:28〜1:53）`;
      if (!['その他', 'BPM変更'].includes(it.type) && !it.amount) return `依頼 ${i + 1}：量を書いてください（例 4エイト）`;
    }
    return '';
  }
  function showErr(t) { const m = $('#msg'); m.textContent = t; m.className = 'msg err'; m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const b = collect();
    const err = check(b);
    if (err) return showErr(err);
    $('#msg').className = 'msg';
    const btn = $('#submit');
    btn.disabled = true; btn.textContent = '送信中…';
    try {
      const r = await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '受付できませんでした');
      $('#done-no').textContent = d.no;
      $('#app').classList.add('is-done');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (x) {
      showErr(x.message && !/JSON|fetch/i.test(x.message) ? x.message : '送信できませんでした。電波のいい所でもう一度送ってください');
      btn.disabled = false; btn.textContent = '依頼を送る';
    }
  });
})();
</script>
</body>
</html>
